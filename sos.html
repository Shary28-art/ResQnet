<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ResQNet — Quick SOS</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .bg-overlay {
      background: rgba(0, 0, 0, 0.6);
    }
    .hero-bg {
      background-image: url('https://static.vecteezy.com/system/resources/thumbnails/054/821/725/small/first-aid-kit-in-the-hand-of-a-tourist-against-the-background-of-winter-nature-a-red-box-with-medicines-emergency-help-for-yourself-in-the-mountains-on-a-hike-photo.jpg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }
    @keyframes fade-in {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade-in {
      animation: fade-in 1s ease-out forwards;
    }
  </style>
</head>
<body class="text-white font-sans">

  <div class="relative min-h-screen hero-bg">
    <div class="absolute inset-0 bg-overlay"></div>

    <div class="relative z-20 flex items-center justify-center min-h-screen px-4 py-10">
      <div class="bg-white bg-opacity-95 rounded-xl shadow-xl p-6 max-w-xl w-full text-gray-800 animate-fade-in">
        <h2 class="text-2xl font-bold text-center text-red-700 mb-4">🚨 Quick SOS Request</h2>
        <p class="text-center text-sm text-gray-600 mb-6">Help us reach you faster by filling this quick form.</p>

        <form class="space-y-4">
          <!-- Emergency Type -->
          <div>
            <label class="block font-medium mb-1">Emergency Type</label>
            <select required class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-red-500">
              <option value="">Select</option>
              <option>Medical</option>
              <option>Rescue</option>
              <option>Food/Water</option>
              <option>Shelter</option>
              <option>Other</option>
            </select>
          </div>

          <!-- Location with Geolocation -->
          <div>
            <label class="block font-medium mb-1">Your Location</label>
            <div class="flex gap-2">
              <input type="text" id="locationInput" required placeholder="Coordinates will appear here" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-red-500">
              <button type="button" onclick="getLocation()" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded">📍 Use My Location</button>
            </div>
            <p id="location-status" class="text-sm mt-2 text-gray-600"></p>
          </div>

          <!-- Contact -->
          <div>
            <label class="block font-medium mb-1">Contact Number</label>
            <input type="tel" required placeholder="Phone or Emergency Contact" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-red-500">
          </div>

          <!-- Optional Note -->
          <div>
            <label class="block font-medium mb-1">Optional Note</label>
            <textarea rows="2" placeholder="Additional info (optional)" class="w-full px-3 py-2 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-red-500"></textarea>
          </div>

          <!-- Submit Button -->
          <div class="text-center">
            <button type="submit" class="bg-red-600 hover:bg-red-700 text-white font-bold py-2 px-6 rounded-full transition duration-300">
              Submit SOS 🚨
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script>
    function getLocation() {
      const status = document.getElementById('location-status');
      const input = document.getElementById('locationInput');

      if (!navigator.geolocation) {F
        status.innerText = "Geolocation is not supported by your browser.";
      } else {
        status.innerText = "Locating...";
        navigator.geolocation.getCurrentPosition(
          position => {
            const lat = position.coords.latitude;
            const lng = position.coords.longitude;
            const coords = `${lat}, ${lng}`;
            input.value = coords;
            status.innerHTML = `📍 Location set: <a href="https://www.google.com/maps?q=${lat},${lng}" target="_blank" class="text-blue-600 underline">View on Map</a>`;
          },
          () => {
            status.innerText = "Unable to retrieve your location.";
          }
        );
      }
    }
  </script>

</body>
</html>
